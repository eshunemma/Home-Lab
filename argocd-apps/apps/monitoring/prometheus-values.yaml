# k3s runs the controller-manager, scheduler and kube-proxy inside the single k3s process, not as
# scrapeable pods, so these targets never come up and their *Down alerts fire permanently
# (KubeControllerManagerDown / KubeSchedulerDown / KubeProxyDown, all `critical`). Turn the
# scrape targets and their alert rules off rather than training everyone to ignore critical alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  enabled: true
  initChownData:
    enabled: false
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: manual-storage
    size: 5Gi
  service:
    type: NodePort
    nodePort: 32000
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      isDefault: false

prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        metadata:
          name: prometheus-db
        spec:
          storageClassName: manual-storage
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        metadata:
          name: alertmanager-db
        spec:
          storageClassName: manual-storage
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
