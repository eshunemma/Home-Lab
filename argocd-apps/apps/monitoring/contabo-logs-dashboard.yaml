# Grafana dashboard "Contabo logs" (folder: Contabo (production)).
# Mounted by the kube-prom-stack Grafana through dashboardsConfigMaps (provider `contabo-logs`,
# see prometheus-values.yaml). Applied by Argo CD (monitoring-stack app) from this path.
# Source: generated by DevOps-Agent docs/scripts/contabo-logs-dashboard/gen_logs_dash.py.
# Shows container logs from the Contabo production server (Grafana Alloy -> Loki over Tailscale).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-contabo-logs
  namespace: monitoring
data:
  contabo-logs.json: |
    {
      "title": "Contabo logs",
      "uid": "contabo-logs",
      "tags": [
        "contabo",
        "production",
        "logs",
        "loki"
      ],
      "description": "Container logs from the Contabo production server (Grafana Alloy -> home Loki over Tailscale, 14-day retention). Contains personal data.",
      "timezone": "browser",
      "editable": false,
      "refresh": "1m",
      "schemaVersion": 39,
      "version": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Logs datasource",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "hide": 0
          },
          {
            "name": "container",
            "label": "Container",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${datasource}"
            },
            "query": {
              "label": "container",
              "stream": "{host=\"contabo-prod\"}",
              "type": 1,
              "refId": "LokiVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values({host=\"contabo-prod\"}, container)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          },
          {
            "name": "search",
            "label": "Search (regex, case-insensitive)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Log lines",
          "description": "Lines logged in the selected time range (after the search filter).",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(count_over_time({host=\"contabo-prod\", container=~\"$container\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error lines",
          "description": "Lines matching error / exception / panic / fatal, or pino level 50-60 (\"level\":50).",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(count_over_time({host=\"contabo-prod\", container=~\"$container\"} |~ `(?i)(\\berror\\b|exception|panic|fatal|\"level\":(50|60))` |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "stderr lines",
          "description": "Lines written to stderr.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum(count_over_time({host=\"contabo-prod\", container=~\"$container\", stream=\"stderr\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Containers logging",
          "description": "Containers that logged at least one line in the time range.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "count(sum by (container) (count_over_time({host=\"contabo-prod\", container=~\"$container\"} [$__range])))",
              "queryType": "instant",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Log volume by container",
          "description": "Lines per interval, per container.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "y": 4,
            "x": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (container) (count_over_time({host=\"contabo-prod\", container=~\"$container\"} |~ \"(?i)$search\" [$__interval]))",
              "queryType": "range",
              "editorMode": "code",
              "legendFormat": "{{container}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ],
              "sortBy": "Total",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 1
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Errors by container",
          "description": "Error-like lines per interval, per container (same rule as the Error lines stat).",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "y": 12,
            "x": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (container) (count_over_time({host=\"contabo-prod\", container=~\"$container\"} |~ `(?i)(\\berror\\b|exception|panic|fatal|\"level\":(50|60))` |~ \"(?i)$search\" [$__interval]))",
              "queryType": "range",
              "editorMode": "code",
              "legendFormat": "{{container}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ],
              "sortBy": "Total",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 1
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "HTTP 5xx in JSON logs",
          "description": "Log lines containing \"status\":5xx or \"statusCode\":5xx (pino/NestJS JSON request logs).",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "y": 20,
            "x": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "sum by (container) (count_over_time({host=\"contabo-prod\", container=~\"$container\"} |~ `\"(status|statusCode)\":5\\d\\d` [$__interval]))",
              "queryType": "range",
              "editorMode": "code",
              "legendFormat": "{{container}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ],
              "sortBy": "Total",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 1
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Error lines",
          "description": "Newest first. Click a line for its labels.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "y": 28,
            "x": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{host=\"contabo-prod\", container=~\"$container\"} |~ `(?i)(\\berror\\b|exception|panic|fatal|\"level\":(50|60))` |~ \"(?i)$search\"",
              "queryType": "range",
              "editorMode": "code"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 9,
          "type": "logs",
          "title": "All logs",
          "description": "Newest first. Use the Container and Search filters above.",
          "datasource": {
            "type": "loki",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "y": 38,
            "x": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${datasource}"
              },
              "expr": "{host=\"contabo-prod\", container=~\"$container\"} |~ \"(?i)$search\"",
              "queryType": "range",
              "editorMode": "code"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }
      ]
    }
