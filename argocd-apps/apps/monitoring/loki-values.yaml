loki:
  auth_enabled: false
  storage:
    type: filesystem
  persistence:
    enabled: true
    storageClassName: manual-storage
    size: 10Gi
  # Keep logs for 14 days, then delete them. Until 2026-10-09 retention was off (kept forever).
  # This Loki also receives the Contabo production server's container logs (pushed by Grafana Alloy
  # over Tailscale; see the DevOps-Agent docs), which contain personal data — don't raise this lightly.
  config:
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      compaction_interval: 10m
    limits_config:
      retention_period: 336h

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push

# loki-stack ships its own Grafana datasource ConfigMap with `loki.isDefault: true`. Next to
# kube-prometheus-stack's default Prometheus datasource, Grafana refuses to start ("Only one
# datasource per organization can be marked as default"). Loki is already provided as a
# non-default datasource by prometheus-values.yaml (grafana.additionalDataSources), so the
# chart's own datasource ConfigMap is switched off entirely.
#
# This file is applied with Helm, not Argo CD:
#   helm upgrade loki loki-stack --repo https://grafana.github.io/helm-charts --version 2.10.3 \
#     -n monitoring -f argocd-apps/apps/monitoring/loki-values.yaml
grafana:
  sidecar:
    datasources:
      enabled: false
